# Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which
# leaves Chrome (agent-browser) with "No usable sandbox" when run as `user`.
# A session VM is disposable and the agent already has passwordless sudo in it,
# so the restriction protects nothing here; Chrome's own sandbox needs it off.
kernel.apparmor_restrict_unprivileged_userns = 0
